                summary: Run a task with input parameters
                value:
                  input_params:
                    File Name: 'invoice-2026-02.pdf'
                    Operation: 'extract_text'
      responses:
        '200':
          description: Task run started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRunStatusV2Response'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to run task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v2/tasks/runs/{runId}/status:
    get:
      summary: Get Task Run Status
      description: |
        Retrieves the current status and result of a task run in the non-deprecated Tasks endpoints.
      security:
        - api_key_header: []
      tags:
        - Tasks
      parameters:
        - name: runId
          in: path
          required: true
          description: The ID of the task run
          schema:
            type: string
      responses:
        '200':
          description: Task run status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRunStatusV2Response'
        '404':
          description: Task run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to retrieve task run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v2/tasks/generate:
    post:
      summary: Generate a Task
      description: |
        Starts asynchronous generation of a new task from a natural-language prompt.
        Poll `GET /v2/tasks/{taskId}/generation-status` until the status is `ready`.
      security:
        - api_key_header: []
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTaskV2Request'
