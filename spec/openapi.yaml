                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to publish task version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete Task Version (Legacy)
      description: |
        Soft deletes a specific version of a task. The version will no longer be accessible
        but the data is preserved for potential recovery.

        If you are using the new Task Builder, see the Tasks V2 endpoints in this API reference.
      security:
        - api_key_header: []
      tags:
        - Tasks (Legacy)
      parameters:
        - name: taskId
          in: path
          required: true
          description: The ID of the task
          schema:
            type: string
            format: uuid
        - name: taskVersion
          in: path
          required: true
          description: The version to delete
          schema:
            type: string
            pattern: '^(draft|latest|\d+)$'
      responses:
        '200':
          description: Task version deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTaskResponse'
        '404':
          description: Task or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to delete task version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/billing:
    get:
      summary: Get Billing Info
      description: >-
        Retrieves credit balance, current-period credit usage, tier, and billing limits for the
        authenticated project. Pass `from_date`, `to_date`, or `granularity` to additionally receive
        a `usage` time series of credits used per period, matching
        `GET /v1/sessions/history?metrics=credits_used`.
      security:
        - api_key_header: []
      tags:
        - Billing
      parameters:
        - in: query
          name: from_date
          required: false
          description: >-
            Start of the usage window (ISO 8601 format, UTC). Passing any of `from_date`, `to_date`,
            or `granularity` adds a `usage` block to the response. Defaults to 30 days ago.
          schema:
            type: string
            format: date-time
        - in: query
          name: to_date
          required: false
          description: End of the usage window (ISO 8601 format, UTC). Defaults to now.
          schema:
            type: string
            format: date-time
        - in: query
          name: granularity
          required: false
          description: Time granularity for the usage time series.
          schema:
            type: string
            enum: [hour, day, week, month]
            default: day
      responses:
        '200':
          description: Billing information retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInfoResponse'
              examples:
                billingInfo:
                  summary: Example billing info
                  value:
                    data:
                      credits: 42.5
                      credits_used: 12.5
                      included_credits: 50
                      billing_period: '2026-04'
                      tier: monthly_starter
                      gifts_balance: 42.5
                      max_concurrent_browsers: 25
                      cost_limit: 100
                billingInfoWithUsage:
                  summary: Example billing info with a usage time series (granularity=day)
                  value:
                    data:
                      credits: 42.5
                      credits_used: 12.5
                      included_credits: 50
                      billing_period: '2026-04'
                      tier: monthly_starter
                      gifts_balance: 42.5
                      max_concurrent_browsers: 25
                      cost_limit: 100
                    usage:
                      from_date: '2026-04-01T00:00:00.000Z'
                      to_date: '2026-04-03T23:59:59.000Z'
                      granularity: day
                      total_credits_used: 12.5
                      data:
                        - date: '2026-04-03T00:00:00.000Z'
                          credits_used: 4.25
                        - date: '2026-04-02T00:00:00.000Z'
                          credits_used: 5.5
                        - date: '2026-04-01T00:00:00.000Z'
                          credits_used: 2.75
        '400':
          description: >-
            Invalid usage query — malformed date, `from_date` after `to_date`, or a date range
            spanning too many buckets for the requested granularity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================================
  # WEBHOOKS — management API for outbound event delivery.
  # ============================================================================
  # Configure HTTPS endpoints to receive Anchor events (task lifecycle, session
  # lifecycle, batch lifecycle, identity authentication, human intervention).
  # Each delivery is signed with HMAC-SHA256 (`Anchor-Signature` header). For
  # the on-the-wire envelope, signature scheme, retry policy, and per-event
  # data shapes see /docs/webhooks/{overview,events,signature-verification}.

  /v1/webhooks:
    post:
      summary: Create Webhook
      operationId: createWebhook
      description: |
        Register a new HTTPS endpoint to receive events. The response includes
        a one-time `secret` (HMAC-SHA256 signing key) — store it; Anchor never
        returns it again. Up to 5 webhooks per project.
      security:
        - api_key_header: []
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateRequest'
            examples:
              taskLifecycle:
                summary: Subscribe to task lifecycle events
                value:
                  url: https://your-app.example.com/anchor/webhooks
                  description: Production task notifications
                  subscribed_events:
                    - task.completed
                    - task.failed
                    - task.healed
              slackForwarder:
                summary: Forward to a Slack incoming webhook
                value:
                  url: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
                  description: '#ops alerts'
                  subscribed_events:
                    - task.failed
                    - session.failed
                    - identity.authentication_failed
      responses:
        '201':
          description: Webhook created. The `secret` field is returned ONCE — copy it now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookWithSecret'
        '400':
          description: |
            Validation error. Common causes — non-HTTPS URL, URL targets a private/loopback IP,
            cloud metadata service, internal-only TLD (`*.local`/`*.internal`), AWS STS/IAM/EKS
            endpoint, contains basic-auth credentials, exceeds 2048 chars, or `subscribed_events` is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'
        '409':
          description: Per-project webhook limit (5) reached. Delete or reuse an existing webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'
        '500':
          description: Failed to create webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'
    get:
      summary: List Webhooks
      operationId: listWebhooks
      description: List every active webhook for the authenticated project. The signing secret is never included.
      security:
        - api_key_header: []
      tags:
        - Webhooks
      responses:
        '200':
          description: All webhooks for this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookListResponse'
        '500':
          description: Failed to list webhooks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'

  /v1/webhooks/{id}:
    get:
      summary: Get Webhook
      operationId: getWebhook
      description: Fetch a single webhook config. The signing secret is never returned.
      security:
        - api_key_header: []
      tags:
        - Webhooks
      parameters:
        - name: id
          in: path
          required: true
          description: Webhook id.
          schema:
            type: string
      responses:
        '200':
          description: Webhook config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookPublic'
        '404':
          description: Webhook not found in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'
        '500':
          description: Failed to load webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'
    patch:
      summary: Update Webhook
      operationId: updateWebhook
      description: |
        Partial update — pass only the fields you want to change. Setting `enabled: false`
        immediately stops events from fanning out to this webhook (existing in-flight
        deliveries finish their attempts).
      security:
        - api_key_header: []
      tags:
        - Webhooks
      parameters:
        - name: id
          in: path
          required: true
          description: Webhook id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookUpdateRequest'
            examples:
              changeUrl:
                summary: Move to a new endpoint URL
                value:
                  url: https://new-host.example.com/anchor/webhooks
              addEvents:
                summary: Add session events to subscriptions
                value:
                  subscribed_events:
                    - task.completed
                    - task.failed
                    - session.completed
                    - session.failed
              disable:
                summary: Pause delivery without losing config
                value:
                  enabled: false
      responses:
        '200':
          description: Webhook updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookPublic'
        '400':
          description: Validation error (URL constraints same as create).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'
        '404':
          description: Webhook not found in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'
        '500':
          description: Failed to update webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'
    delete:
      summary: Delete Webhook
      operationId: deleteWebhook
      description: |
        Soft-delete a webhook. New events stop fanning out immediately. The events
        history (`/v1/webhooks/{id}/events`) is still queryable for the retention
        window even after delete.
      security:
        - api_key_header: []
      tags:
        - Webhooks
      parameters:
        - name: id
          in: path
          required: true
          description: Webhook id.
          schema:
            type: string
      responses:
        '200':
          description: Webhook deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeleteResponse'
        '404':
          description: Webhook not found in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'
        '500':
          description: Failed to delete webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'

  /v1/webhooks/{id}/rotate-secret:
    post:
      summary: Rotate Webhook Signing Secret
      operationId: rotateWebhookSecret
      description: |
        Mint a new HMAC-SHA256 signing secret. The previous secret remains valid
        for 24 hours so you can update your verification code at your own pace,
        then drop the old secret.

        The new secret is returned exactly once, in the `secret` field.
      security:
        - api_key_header: []
      tags:
        - Webhooks
      parameters:
        - name: id
          in: path
          required: true
          description: Webhook id.
          schema:
            type: string
      responses:
        '200':
          description: New signing secret issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookWithSecret'
        '404':
          description: Webhook not found in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'
        '500':
          description: Failed to rotate secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'

  /v1/webhooks/{id}/test:
    post:
      summary: Send Test Event
      operationId: sendWebhookTestEvent
      description: |
        Fire a synthetic event of the given type through the real signing + retry
        path. Useful during development for confirming your endpoint can verify
        the signature and is reachable from Anchor's egress IPs.

        The synthetic delivery counts toward your delivery log so you can see it
        in `GET /v1/webhooks/{id}/events`.
      security:
        - api_key_header: []
      tags:
        - Webhooks
      parameters:
        - name: id
          in: path
          required: true
          description: Webhook id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookTestRequest'
            examples:
              taskCompleted:
                summary: Test a task.completed event
                value:
                  event_type: task.completed
              sessionRecordingReady:
                summary: Test a session.recording.ready event
                value:
                  event_type: session.recording.ready
      responses:
        '202':
          description: Synthetic event accepted and enqueued for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestResponse'
        '400':
          description: Unknown event type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'
        '404':
          description: Webhook not found in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'
        '500':
          description: Failed to enqueue test event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'

  /v1/webhooks/{id}/events:
    get:
      summary: List Webhook Deliveries
      operationId: listWebhookEvents
      description: |
        Paginated history of every delivery attempt for this webhook (succeeded,
        failed, or dead-lettered). Filter by status, event type, or time range.
        Retention: 7 days.
      security:
        - api_key_header: []
      tags:
        - Webhooks
      parameters:
        - name: id
          in: path
          required: true
          description: Webhook id.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size, 1–100. Defaults to 25.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: Number of rows to skip from the beginning of the result set.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: status
          in: query
          required: false
          description: Filter by delivery status.
          schema:
            type: string
            enum:
              - pending
              - succeeded
              - failed
              - dead
        - name: event_type
          in: query
          required: false
          description: Filter by event type.
          schema:
            $ref: '#/components/schemas/WebhookEventType'
        - name: since
          in: query
          required: false
          description: Only include deliveries scheduled at or after this ISO 8601 timestamp.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: Only include deliveries scheduled at or before this ISO 8601 timestamp.
          schema:
            type: string
            format: date-time
        - name: include_payload
          in: query
          required: false
          description: >
            Set to `true` to include each delivery's sanitized event `data`
            (as delivered to your endpoint) in the `payload` field of every row.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
      responses:
        '200':
          description: Page of delivery rows plus pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEventsListResponse'
        '404':
          description: Webhook not found in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'
        '500':
          description: Failed to load webhook events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatErrorResponse'
