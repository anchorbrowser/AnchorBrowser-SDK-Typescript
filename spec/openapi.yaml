  /v1/sessions/{session_id}/agent/pause:
    post:
      summary: Pause Agent
      description: Pauses the AI agent for the specified browser session.
      security:
        - api_key_header: []
      tags:
        - Agentic capabilities
      parameters:
        - name: session_id
          in: path
          required: true
          description: The ID of the browser session
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Agent paused successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Session is not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to pause agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sessions/{session_id}/agent/resume:
    post:
      summary: Resume Agent
      description: Resumes the AI agent for the specified browser session.
      security:
        - api_key_header: []
      tags:
        - Agentic capabilities
      parameters:
        - name: session_id
          in: path
          required: true
          description: The ID of the browser session
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Agent resumed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Session is not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to resume agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v2/tasks/generate:
    post:
      summary: Generate Task
      description: Initiates asynchronous task generation. Use the returned task ID to poll for completion, then execute the task.
      security:
        - api_key_header: []
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTaskRequest'
            examples:
              generateTask:
                summary: Generate a task from a description
                value:
                  taskName: 'file-downloader'
                  description: 'Download a specific file from a URL'
                  taskPrompt: 'Create a task that downloads a specific file from a given URL.'
                  input_schema:
                    - display_name: 'URL'
                      type: 'string'
                      required: true
                      description: 'URL of the file to download'
                    - display_name: 'File Name'
                      type: 'string'
                      required: true
                      description: 'Name of the file to download'
                  output_schema:
                    - display_name: 'Success'
                      type: 'boolean'
                      description: 'Whether the download succeeded'
                    - display_name: 'Message'
                      type: 'string'
                      description: 'Status or error message'
      responses:
        '200':
          description: Task generation started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateTaskResponse'
        '400':
          description: Invalid request or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to start task generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v2/tasks/{taskId}/generation-status:
    get:
      summary: Get Task Generation Status
      description: |
        Returns the current status of asynchronous task generation. Poll this endpoint
        after generating a task until status is ready or failed.
      security:
        - api_key_header: []
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          description: The ID of the task (from the generate response)
          schema:
            type: string
      responses:
        '200':
          description: Current generation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskGenerationStatusResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to get task generation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v2/tasks/{taskId}/run:
    post:
      summary: Run a Task
      description: |
        Triggers execution of a task by ID using the V2 tasks API.
      security:
        - api_key_header: []
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          description: The ID of the task to run
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunTaskRequest'
            examples:
              runTaskV2:
                summary: Run a task with input parameters
                value:
                  input_params:
                    File Name: 'invoice-2026-02.pdf'
                    Operation: 'extract_text'
      responses:
        '200':
          description: Task run started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRunStatusResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to run task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v2/tasks/runs/{runId}/status:
    get:
      summary: Get Task Run Status
      description: |
        Retrieves the current status and result of a task run in the V2 tasks API.
      security:
        - api_key_header: []
      tags:
        - Tasks
      parameters:
        - name: runId
          in: path
          required: true
          description: The ID of the task run
          schema:
            type: string
      responses:
        '200':
          description: Task run status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRunStatusResponse'
        '404':
          description: Task run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to retrieve task run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

tags: []
