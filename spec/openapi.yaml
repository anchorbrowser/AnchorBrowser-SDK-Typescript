    get:
      summary: Get Identity
      description: |
        Retrieves details of a specific identity by its ID.
      security:
        - api_key_header: []
      tags:
        - Identities
      parameters:
        - name: identity_id
          in: path
          required: true
          description: The ID of the identity to retrieve
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Identity details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIdentityResponseSchema'
        '404':
          description: Identity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to get identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update Identity
      description: |
        Updates an existing identity's name, metadata, or credentials.
      security:
        - api_key_header: []
      tags:
        - Identities
      parameters:
        - name: identity_id
          in: path
          required: true
          description: The ID of the identity to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIdentityRequestSchema'
            examples:
              updateIdentityName:
                summary: Update identity name
                value:
                  name: 'Updated Account Name'
              updateIdentityCredentials:
                summary: Update identity credentials
                value:
                  credentials:
                    - type: 'username_password'
                      username: 'newuser@example.com'
                      password: 'newpassword123'
      responses:
        '200':
          description: Identity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateIdentityResponseSchema'
        '404':
          description: Identity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to update identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete Identity
      description: |
        Deletes an existing identity.
      security:
        - api_key_header: []
      tags:
        - Identities
      parameters:
        - name: identity_id
          in: path
          required: true
          description: The ID of the identity to delete
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Identity deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteIdentityResponseSchema'
        '404':
          description: Identity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to delete identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

