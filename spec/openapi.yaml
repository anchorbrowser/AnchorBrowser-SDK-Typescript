  /v1/events/{event_name}/wait:
    post:
      summary: Wait for Event
      description: |
        Waits for a specific event to be signaled by another process, workflow, or session. 
        This endpoint blocks until the event is signaled or the timeout is reached.
        Useful for coordinating between multiple browser sessions or workflows.
      security:
        - api_key_header: []
      tags:
        - Event Coordination
      parameters:
        - name: event_name
          in: path
          required: true
          description: The name of the event to wait for
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitForEventRequestSchema'
      responses:
        '200':
          description: Event was signaled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseSchema'
        '401':
          description: Unauthorized - Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Timeout - Event was not signaled within the specified timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to wait for event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/events/{event_name}:
    post:
      summary: Signal Event
      description: |
        Signals an event with associated data, unblocking any clients waiting for this event.
        This enables coordination between different browser sessions, workflows, or external processes.
      security:
        - api_key_header: []
      tags:
        - Event Coordination
      parameters:
        - name: event_name
          in: path
          required: true
          description: The name of the event to signal
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalEventRequestSchema'
      responses:
        '200':
          description: Event signaled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request - Event data is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to signal event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/batch-sessions:
    get:
      summary: List Batch Sessions
      description: |
        Lists all batch session requests for the authenticated team, with optional filtering
        by status and pagination support.
      security:
        - api_key_header: []
      tags:
        - Batch Sessions
      parameters:
        - name: status
          in: query
          required: false
          description: Filter batches by status
          schema:
            type: string
            enum: [pending, processing, completed, failed, cancelled]
        - name: page
          in: query
          required: false
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of results per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: created_after
          in: query
          required: false
          description: Filter batches created after this timestamp (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          required: false
          description: Filter batches created before this timestamp (ISO 8601)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Batch list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BatchSessionListResponseSchema'
        '401':
          description: Invalid API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create Batch Sessions
      description: |
        Creates multiple browser sessions in a single batch operation. This endpoint allows you to
        create up to 5,000 browser sessions simultaneously with the same configuration.

        The batch will be processed asynchronously, and you can monitor progress using the batch status endpoint.
      security:
        - api_key_header: []
      tags:
        - Batch Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSessionRequestSchema'
            examples:
              small_batch:
                summary: Small batch example
                value:
                  count: 10
                  configuration:
                    browser:
                      headless:
                        active: true
                      viewport:
                        width: 1440
                        height: 900
                    session:
                      timeout:
                        idle_timeout: 10
                        max_duration: 300
                  metadata:
                    project: 'web-scraping'
                    environment: 'production'
              large_batch:
                summary: Large batch example (from test snippet)
                value:
                  count: 2500
                  configuration:
                    browser:
                      headless:
                        active: true
                      viewport:
                        width: 1440
                        height: 900
                      recording:
                        active: true
                    session:
                      timeout:
                        idle_timeout: 10
                        max_duration: 300
                      tags: ['batch-test-comprehensive']
                  metadata:
                    test: true
                    description: 'Comprehensive batch test with 3 sessions'
      responses:
        '200':
          description: Batch created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BatchSessionResponseSchema'
