openapi: 3.1.0
info:
  title: AnchorBrowser API
  version: 1.0.0
  description: |
    Anchor Browser ([anchorbrowser.io](https://anchorbrowser.io)) provides cloud browsers built
    for AI agents and automation. Use this API to launch and control browser sessions, run
    natural-language web tasks, authenticate into third-party web apps with managed identities,
    and capture recordings — reliably and at scale, without operating browser infrastructure
    yourself.

    ## Core resources
    - **Sessions** (`/v1/sessions`): launch configurable cloud browsers — residential proxies,
      stealth browsing, captcha solving, profiles, extensions, recording — and connect over CDP
      with Playwright, Puppeteer, or any CDP client.
    - **AI tools** (`/v1/tools/perform-web-task`): state a goal in natural language and the
      built-in agent completes it inside the browser. Related tools fetch webpages, take
      screenshots, render PDFs, and execute code in a session.
    - **Tasks** (`/v1/task`): create, version, deploy, and monitor repeatable browser
      automations built to run reliably in production.
    - **Applications and identities** (`/v1/applications`, `/v1/identities`): managed
      authentication into third-party web apps — including multi-step logins and TOTP-based
      2FA — so agents can act on behalf of users.
    - **Profiles** (`/v1/profiles`): persist cookies and login state across sessions.
    - **OS-level control** (`/v1/sessions/{sessionId}/mouse`, `/keyboard`, `/clipboard`):
      raw input for flows that resist DOM automation.
    - Plus batch sessions for running browser fleets in parallel, session recordings, webhooks,
      events, extensions, client certificates, and billing usage.

    ## Authentication
    Pass an API key in the `anchor-api-key` header on every request. Create keys at
    [app.anchorbrowser.io](https://app.anchorbrowser.io) under API Access. AI agents that have
    no key yet can obtain one autonomously through the unauthenticated
    [agent-access flow](https://docs.anchorbrowser.io/quickstart/agent-access)
    (`POST /v1/agent-access`).

    ## For AI agents and LLMs
    - Docs: [docs.anchorbrowser.io](https://docs.anchorbrowser.io), with a machine-readable
      index at [/llms.txt](https://docs.anchorbrowser.io/llms.txt) and the full corpus at
      [/llms-full.txt](https://docs.anchorbrowser.io/llms-full.txt).
    - MCP server for hosted browser control: `https://api.anchorbrowser.io/mcp`.
    - Official SDKs: `anchorbrowser` on [npm](https://www.npmjs.com/package/anchorbrowser) and
      [PyPI](https://pypi.org/project/anchorbrowser/).

    `DELETE` operations terminate sessions or permanently remove resources (profiles,
    identities, extensions); `GET` operations are safe and read-only.
servers:
  - url: https://api.anchorbrowser.io
    description: API server
components:
  securitySchemes:
    api_key_header:
      type: apiKey
      in: header
      name: anchor-api-key
      description: |
        API key for your Anchor Browser account, sent as the `anchor-api-key` header on every
        request. Create one at [app.anchorbrowser.io](https://app.anchorbrowser.io) (API Access),
        or obtain one programmatically via the unauthenticated agent-access flow
        (`POST /v1/agent-access`).
  schemas:
    # ==============================
    # SHARED RESPONSE SCHEMAS
    # ==============================
    # These schemas are used across multiple resources
    SuccessResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string

    # ==============================
    # PROXY CONFIGURATION SCHEMAS
    # ==============================
    ProxyConfig:
      description: |
        Proxy Documentation available at [Proxy Documentation](/advanced/proxy)
      type: object
      oneOf:
        - $ref: '#/components/schemas/AnchorProxy'
        - $ref: '#/components/schemas/CustomProxy'

    AnchorProxy:
      title: Anchor Proxy
      type: object
      properties:
        active:
          type: boolean
        type:
          type: string
          enum: [anchor_proxy]
          description: Create a session with a proxy to access websites as if you're browsing from a computer in that country.
          title: anchor_proxy
        country_code:
          $ref: '#/components/schemas/AnchorProxyCountryCode'
          description: |
            Supported country codes ISO 2 lowercase
        region:
          type: string
          description: |
            Region code for more specific geographic targeting.
            The city parameter can only be used when region is also provided.
        city:
          type: string
          description: |
            City name for precise geographic targeting. Supported for anchor_proxy only.
            Can only be used when region is also provided.
      required: [active]

    CustomProxy:
      title: Custom Proxy
      type: object
      properties:
        type:
          type: string
          enum: [custom]
        server:
          type: string
          description: Proxy address in **PROTOCOL://HOST:PORT** format (e.g., https://proxy.example.com:443). See [Bring Your Own Proxy](/advanced/bring-your-own-proxy).
        username:
          type: string
          description: Proxy username
        password:
          type: string
          description: Proxy password
        active:
          type: boolean
      required: [type, server, username, password, active]

    AnchorProxyCountryCode:
      type: string
      title: anchor_proxy
