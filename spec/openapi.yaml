          type: string
          description: Name of the identity
        metadata:
          type: object
          additionalProperties: true
          description: Metadata associated with the identity
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the identity was last updated

    DeleteIdentityResponseSchema:
      type: object
      properties:
        message:
          type: string
          description: Deletion result message

    # ==============================
    # IDENTITY CREDENTIALS SCHEMAS
    # ==============================

    IdentityCredentialsResponseSchema:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the identity
        name:
          type: string
          description: The name of the identity
        source:
          type: string
          description: The url related to the identity
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/CredentialSchema'

    CredentialSchema:
      oneOf:
        - $ref: '#/components/schemas/UsernamePasswordCredentialSchema'
        - $ref: '#/components/schemas/AuthenticatorCredentialSchema'
        - $ref: '#/components/schemas/CustomCredentialSchema'

    UsernamePasswordCredentialSchema:
      type: object
      properties:
        type:
          type: string
          enum: [username_password]
          description: The type of credential
        username:
          type: string
          description: The username of the credential
        password:
          type: string
          description: The password of the credential

    AuthenticatorCredentialSchema:
      type: object
      properties:
        type:
          type: string
          enum: [authenticator]
          description: The type of credential
        secret:
          type: string
          description: The secret of the credential
        otp:
          type: string
          description: The OTP of the credential

    CustomCredentialSchema:
      type: object
      properties:
        type:
          type: string
          enum: [custom]
          description: The type of credential
        fields:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the field
              value:
                type: string
                description: The value of the field

