          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateTaskV2Response'
        '400':
          description: Invalid task generation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error generating task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v2/tasks/{taskId}/generation-status:
    get:
      summary: Get Task Generation Status
      description: |
        Returns the generation status of a task created via `POST /v2/tasks/generate`.
      security:
        - api_key_header: []
      tags:
        - Tasks
      parameters:
