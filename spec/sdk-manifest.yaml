# sdk-manifest.yaml — SDK naming map (v2, full-generation architecture).
#
# Maps every operation in the public OpenAPI spec (docs/openapi.yaml) to its
# SDK class and method name (the operationId). scripts/utils/prepare-spec.cjs
# injects these into the spec copy the generator consumes, so the public docs
# spec never needs SDK-specific annotations.
#
# New operations that have no entry here get a deterministic auto-derived
# name (class from the operation tag, method from HTTP verb + path) — add an
# entry to override. Canonical copy: anchorbrowser monorepo docs/sdk-manifest.yaml.

version: 2

